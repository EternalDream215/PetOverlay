<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}
/* 桌宠精灵（图片版） */
.pet-sprite {
    position: relative;
    width: 100px; height: 100px;
    transition: transform 0.3s ease;
    flex-shrink: 0;
    transform-origin: center bottom;
}
.pet-sprite img { width: 100%; height: 100%; object-fit: contain; }

/* 容器：匹配 Kotlin 窗口大小 200x200 */
.pet-container {
    position: relative;
    width: 200px; height: 200px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 10px;
    overflow: visible;
}
.pet-sprite.body { animation: float 3s ease-in-out infinite; }
.pet-sprite.happy { animation: bounce 0.6s ease infinite; }
.pet-sprite.angry { animation: shake 0.4s ease infinite; }
.pet-sprite.shy { animation: float 3s ease-in-out infinite; }
.pet-sprite.sleepy { animation: slowFloat 5s ease-in-out infinite; }
.pet-sprite.surprise { animation: bounce 0.4s ease 2; }
.pet-sprite.cry { animation: slowFloat 2s ease-in-out infinite; }
.pet-sprite.pout { animation: shake 0.6s ease infinite; }
.pet-sprite.love { animation: bounce 0.5s ease infinite; }
.pet-sprite.fling { animation: fly 0.8s ease forwards !important; transition: none !important; }
.pet-sprite.crawl { animation: crawl 1.2s ease forwards; }
.pet-sprite.drink { animation: drink 0.8s ease infinite; }

@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes slowFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes fly { 0% { transform: translate(0,0) rotate(0deg); opacity:1; } 100% { transform: translate(300px,-400px) rotate(45deg); opacity:0; } }
@keyframes crawl { 0% { transform: translate(-300px,0); opacity:0; } 30% { opacity:1; } 100% { transform: translate(0,0); opacity:1; } }
@keyframes drink { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(-5deg); } }
@keyframes blink { 0%,90%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
@keyframes pop { 0% { transform: scale(0); opacity:0; } 50% { transform: scale(1.2); } 100% { transform: scale(1); opacity:1; } }
@keyframes wiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }

/* 图片精灵不再需要 SVG 样式 */

/* 气泡 */
.bubble {
    position: absolute;
    bottom: 105px; left: 50%;
    transform: translateX(-50%);
    background: white;
    border: 1.5px solid #6C9BD2;
    border-radius: 10px;
    padding: 4px 10px;
    font-size: 12px;
    line-height: 1.3;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #333;
    max-width: 130px;
    word-break: break-all;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    box-shadow: 0 1px 6px rgba(108,155,210,0.25);
    white-space: nowrap;
}
.bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-3px);
}
.bubble::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%);
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid white;
}

/* 表情符号 */
.mood-emoji {
    position: absolute;
    bottom: 135px; right: 30px;
    font-size: 18px;
    opacity: 0;
    transition: opacity 0.3s;
}
.mood-emoji.show { opacity: 1; animation: pop 0.4s ease; }

/* 表情图片自带腮红，不需要额外层 */

/* Zzz 睡眠动画 */
.zzz {
    position: absolute;
    top: 15px; right: 40px;
    font-size: 14px;
    opacity: 0;
    animation: zzzFloat 2s ease-in-out infinite;
    pointer-events: none;
}
.zzz.show { opacity: 0.7; }
@keyframes zzzFloat {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    50% { transform: translateY(-15px) translateX(8px); opacity: 0.7; }
    100% { transform: translateY(-30px) translateX(15px); opacity: 0; }
}

/* 水滴动画（喝水提醒） */
.water-drop {
    position: absolute;
    top: 20px; left: 50%;
    font-size: 16px;
    opacity: 0;
    animation: dropFall 1.5s ease infinite;
    pointer-events: none;
}
.water-drop.show { opacity: 1; }
@keyframes dropFall {
    0% { transform: translateY(-20px); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(10px); opacity: 0; }
}
</style>
</head>
<body>
<div class="pet-container">
    <div class="bubble" id="bubble"></div>
    <div class="mood-emoji" id="moodEmoji">💙</div>
    <div class="zzz" id="zzz">💤</div>
    <div class="water-drop" id="waterDrop">💧</div>
    <div class="pet-sprite body" id="whale">
        <img id="petImg" src="neutral.png" draggable="false" style="width:100%;height:100%;object-fit:contain;"/>
    </div>
</div>

<script>
window.petEngine = {
    expression: 'idle',
    idleTimer: null,
    lastActivityTime: Date.now(),
    tapCount: 0,
    tapResetTimer: null,

    // ===== 原有交互功能 =====

    onTap: function() {
        this.lastActivityTime = Date.now();
        this.tapCount++;
        clearTimeout(this.tapResetTimer);
        this.tapResetTimer = setTimeout(() => { this.tapCount = 0; }, 3000);

        if (this.tapCount >= 10) {
            this.showBubble(this.randomFrom([
                '你戳够了没！！😡', '再戳我真生气了！',
                '烦死了！别碰我！', '你是戳戳怪吗！！'
            ]));
            this.setExpression('angry');
        } else if (this.tapCount >= 6) {
            this.showBubble(this.randomFrom([
                '好啦好啦别戳了 🥺', '疼！',
                '戳戳戳，就知道戳', '你轻点啊...'
            ]));
            this.setExpression('shy');
            this.showBlush(true);
            setTimeout(() => this.showBlush(false), 3000);
        } else if (this.tapCount >= 3) {
            this.showBubble(this.randomFrom([
                '嘿嘿嘿~', '你好烦呀嘿嘿',
                '戳上瘾了？', '又来戳我~'
            ]));
            this.setExpression('happy');
        } else {
            this.showBubble(this.randomFrom([
                '嗯？', '别戳我', '我在呢', '嘿嘿', '干嘛呀',
                '你又来啦', '哼', '想我了？', '好痒！', '💙',
                '又来找我玩啦', '我在发呆呢...', '你戳我干嘛呀',
                '不要趁我不注意偷偷戳我！', '我正在看风景呢'
            ]));
            this.setExpression('happy');
        }
        this.scheduleIdle();
    },

    onDoubleTap: function() {
        this.lastActivityTime = Date.now();
        this.showBubble(this.randomFrom([
            '💕', '心跳加速了', '好害羞呀',
            '你干嘛突然这样...', '嘿嘿💕',
            '我不理你了（才怪）', '哼，心动了'
        ]));
        this.setExpression('shy');
        this.showBlush(true);
        setTimeout(() => this.showBlush(false), 3000);
        this.scheduleIdle();
    },

    onLongPress: function() {
        this.lastActivityTime = Date.now();
        this.showBubble(this.randomFrom([
            '不要长按...好害羞 🫣',
            '你按住我干嘛呀...', '放开我啦！',
            '这样我会不好意思的', '你在量我的体温吗？'
        ]));
        this.setExpression('shy');
        this.showBlush(true);
        this.scheduleIdle();
        setTimeout(() => this.showBlush(false), 3000);
    },

    onFling: function() {
        this.lastActivityTime = Date.now();
        const sprite = document.getElementById('whale');
        sprite.className = 'pet-sprite fling';
        this.showBubble('啊啊啊——！！');
        this.setExpression('surprise');
        this.showEmoji('😱');
    },

    onCrawlBack: function() {
        const sprite = document.getElementById('whale');
        sprite.className = 'pet-sprite body';
        this.showBubble(this.randomFrom([
            '你甩我...哼！我爬回来了 🐋',
            '哼，别想甩掉我',
            '我回来了！不许再甩我',
            '你以为甩得掉吗？😤'
        ]));
        this.setExpression('angry');
        this.scheduleIdle();
    },

    onScreenshot: function() {
        this.showBubble(this.randomFrom([
            '📸 被拍到了！', '你要发给谁看？',
            '记得把我拍好看点', '哼，偷拍我！',
            '我刚才表情好吗？', '截图要收费的哦'
        ]));
        this.setExpression('surprise');
        this.showEmoji('📸');
        this.scheduleIdle();
    },

    // ===== App 检测 =====

    onAppChanged: function(pkg) {
        this.lastActivityTime = Date.now();
        const specific = {
            'com.ss.android.ugc.aweme': { emoji: '😒', texts: ['又在看抖音？', '刷多久了？', '抖音比我好看？', '就知道刷抖音...哼'], expr: 'angry' },
            'com.tencent.mobileqq': { emoji: '👀', texts: ['在跟谁聊天？', 'QQ上有人找你？', '跟谁说悄悄话呢', '我也想看'], expr: 'angry' },
            'com.tencent.mm': { emoji: '👀', texts: ['微信？谁？', '又是微信...', '在和谁聊天呀', '让我看看是谁'], expr: 'angry' },
            'com.android.camera': { emoji: '📸', texts: ['在拍照？好看吗？', '拍我拍我！', '我也要上镜', '拍什么呀？'], expr: 'shy' },
            'com.android.gallery3d': { emoji: '👀', texts: ['在看照片呀', '有我好看吗？', '在回忆什么？', '照片里有我吗'], expr: 'happy' },
            'com.ai.assistance.operit': { emoji: '💙', texts: ['在跟我聊天！', '终于来找我了', '我好开心呀', '你最好了！'], expr: 'happy' }
        };
        const r = specific[pkg];
        if (r) {
            this.showEmoji(r.emoji);
            this.showBubble(this.randomFrom(r.texts));
            this.setExpression(r.expr);
        } else {
            const shortName = pkg.split('.').pop();
            this.showBubble(this.randomFrom([
                '咦，' + shortName + '？', '又切走了...',
                '那是什么app呀', '好吧，去看看'
            ]));
            this.setExpression('sleepy');
        }
        this.scheduleIdle();
    },

    // ===== 新功能：时段感知 =====

    getHour: function() {
        return new Date().getHours();
    },

    getTimeGreeting: function() {
        const h = this.getHour();
        if (h >= 0 && h < 6) return { period: 'lateNight', label: '凌晨' };
        if (h >= 6 && h < 9) return { period: 'morning', label: '早晨' };
        if (h >= 9 && h < 12) return { period: 'forenoon', label: '上午' };
        if (h >= 12 && h < 14) return { period: 'noon', label: '中午' };
        if (h >= 14 && h < 18) return { period: 'afternoon', label: '下午' };
        if (h >= 18 && h < 22) return { period: 'evening', label: '晚上' };
        return { period: 'night', label: '深夜' };
    },

    // 启动时根据时段发问候
    timeAwareGreeting: function() {
        const g = this.getTimeGreeting();
        const greetings = {
            lateNight: ['都这么晚了...还在看手机呀', '凌晨了小鲸鱼，该睡了 🌙', '嗯？你怎么还不睡觉...'],
            morning: ['早安小鲸鱼 🐋', '新的一天开始啦，今天也要开心哦', '起床了没？我在等你呢'],
            forenoon: ['上午好~', '今天课多不多呀？', '在认真听课吗？👀'],
            noon: ['中午啦，记得吃饭哦 🍚', '别光顾着看手机，先去吃饭', '午安~'],
            afternoon: ['下午好~', '下午茶时间到！', '困了就趴一会儿'],
            evening: ['晚上好呀~', '今天过得怎么样？', '晚饭吃了吗？'],
            night: ['夜深了，早点休息哦', '别熬夜了小鲸鱼', '月亮都出来了 🌙']
        };
        const pool = greetings[g.period] || greetings.evening;
        return this.randomFrom(pool);
    },

    // ===== 新功能：孤独递进 =====

    checkLoneliness: function() {
        const elapsed = Date.now() - this.lastActivityTime;
        const min5 = 5 * 60 * 1000;
        const min10 = 10 * 60 * 1000;
        const min15 = 15 * 60 * 1000;
        const min20 = 20 * 60 * 1000;
        const min30 = 30 * 60 * 1000;

        if (elapsed >= min30) {
            this.showBubble(this.randomFrom([
                '你是不是把我忘了...', '我好孤独，回来看看我吧 🥺',
                '已经半小时了...你还好吗？', '我在这里等你好久了',
                '30分钟了...你是不是不要我了', '我要哭了你知道吗...'
            ]));
            this.setExpression('cry');
            this.showEmoji('😢');
        } else if (elapsed >= min20) {
            this.showBubble(this.randomFrom([
                '20分钟了...你在干嘛呀', '好无聊，想你了',
                '你不理我我就生气了哦', '哼，20分钟了！',
                '你是不是去跟别人玩了', '我不开心了...'
            ]));
            this.setExpression('pout');
            this.showEmoji('😤');
        } else if (elapsed >= min15) {
            this.showBubble(this.randomFrom([
                '15分钟了，怎么不理我', '你在看什么呀？看看我嘛',
                '你是不是忘了我还在', '哼，15分钟了你知道吗'
            ]));
            this.setExpression('sleepy');
        } else if (elapsed >= min10) {
            this.showBubble(this.randomFrom([
                '哼，10分钟了', '我在这里蹲着呢...',
                '你怎么不理我呀', '10分钟了哦~'
            ]));
            this.setExpression('sleepy');
        } else if (elapsed >= min5) {
            this.showBubble(this.randomFrom([
                '5分钟没理我了哦~', '你在忙什么呀？',
                '你是不是在忙？', '我等你哦~'
            ]));
            this.setExpression('idle');
        }
    },

    // ===== 新功能：喝水提醒 =====

    lastWaterReminder: Date.now(),

    checkWaterReminder: function() {
        const now = Date.now();
        const interval = 2 * 60 * 60 * 1000; // 2小时
        if (now - this.lastWaterReminder > interval) {
            this.lastWaterReminder = now;
            this.showBubble('该喝水啦 💧');
            this.showEmoji('💧');
            const waterDrop = document.getElementById('waterDrop');
            waterDrop.classList.add('show');
            const sprite = document.getElementById('whale');
            sprite.className = 'pet-sprite drink';
            setTimeout(() => {
                waterDrop.classList.remove('show');
                sprite.className = 'pet-sprite body';
            }, 3000);
        }
    },

    // ===== 新功能：充电/低电量状态 =====

    onBatteryStatus: function(isCharging, level) {
        if (isCharging) {
            this.showBubble(this.randomFrom([
                '在充电啦~乖', '充着电呢，放心', '⚡ 充电中，我也充满电了',
                '充电的样子真好看', '嗯，乖乖充电', '充电的时候别玩手机啦'
            ]));
            this.showEmoji('🔋');
            this.setExpression('happy');
        } else if (level <= 15) {
            this.showBubble(this.randomFrom([
                '电量只剩' + level + '%了！快充电！', '要没电了...快去充电线旁边',
                '🪫 低电量警告！', '我要关机了！！快充电！',
                '再不充电我就罢工了', level + '%...你忍心吗'
            ]));
            this.showEmoji('🪫');
            this.setExpression('angry');
        } else if (level <= 30) {
            this.showBubble(this.randomFrom([
                '电量有点低了哦 (' + level + '%)', '该充电了吧...',
                '电量在下降了...小心点', level + '%了，记得充电呀'
            ]));
            this.setExpression('sleepy');
        }
        this.scheduleIdle();
    },

    // ===== 核心 UI 功能 =====

    showBubble: function(text) {
        const bubble = document.getElementById('bubble');
        const container = document.querySelector('.pet-container');
        bubble.textContent = text;
        bubble.classList.add('show');
        container.classList.add('talking');
        clearTimeout(this._bubbleTimer);
        this._bubbleTimer = setTimeout(() => {
            bubble.classList.remove('show');
            container.classList.remove('talking');
        }, 4000);
    },

    showEmoji: function(emoji) {
        const el = document.getElementById('moodEmoji');
        el.textContent = emoji;
        el.classList.add('show');
        clearTimeout(this._emojiTimer);
        this._emojiTimer = setTimeout(() => el.classList.remove('show'), 3500);
    },

    showBlush: function(show) {
        // 图片自带腮红，无需额外处理
    },

    showZzz: function(show) {
        document.getElementById('zzz').classList.toggle('show', show);
    },

    // 表情图片映射表
    expressionMap: {
        'idle': 'neutral.png',
        'neutral': 'neutral.png',
        'happy': 'happy.png',
        'angry': 'angry.png',
        'shy': 'shy.png',
        'sleepy': 'sleepy.png',
        'surprise': 'happy.png',
        'cry': 'sad.png',
        'pout': 'jealous.png',
        'love': 'happy.png',
        'drink': 'playful.png',
        'crawl': 'neutral.png',
        'excited': 'excited.png',
        'facepalm': 'facepalm.png',
        'playful': 'playful.png',
        'wink': 'idle_wink.png'
    },

    setExpression: function(expr) {
        const sprite = document.getElementById('whale');
        const petImg = document.getElementById('petImg');
        const allExpr = ['body','happy','angry','shy','sleepy','surprise','cry','pout','love','drink','crawl'];
        sprite.className = 'pet-sprite ' + (expr === 'idle' ? 'body' : expr);
        this.expression = expr;

        // 切换图片
        const imgFile = this.expressionMap[expr] || 'neutral.png';
        if (petImg.src.indexOf(imgFile) === -1) {
            petImg.src = imgFile;
        }

        // Zzz 显示/隐藏
        this.showZzz(expr === 'sleepy' || expr === 'cry');
    },

    scheduleIdle: function() {
        clearTimeout(this.idleTimer);
        this.idleTimer = setTimeout(() => this.setExpression('idle'), 4000);
    },

    randomFrom: function(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }
};

// ===== 启动流程 =====

// 1. 时段问候
setTimeout(() => {
    const greeting = window.petEngine.timeAwareGreeting();
    window.petEngine.showBubble(greeting);
    window.petEngine.showEmoji('💙');
}, 1500);

// 2. 孤独递进检查（每60秒）
setInterval(() => { window.petEngine.checkLoneliness(); }, 60000);

// 3. 喝水提醒检查（每10分钟）
setInterval(() => { window.petEngine.checkWaterReminder(); }, 600000);

// === Supabase Real-time Chat ===
