<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}
.pet-container {
    position: relative;
    width: 200px; height: 200px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 20px;
}
/* 鲸鱼身体 */
.whale {
    position: relative;
    width: 80px; height: 65px;
    transition: transform 0.3s ease;
    flex-shrink: 0;
}
.whale.body { animation: float 3s ease-in-out infinite; }
.whale.happy { animation: bounce 0.6s ease infinite; }
.whale.angry { animation: shake 0.4s ease infinite; }
.whale.shy { animation: float 3s ease-in-out infinite; }
.whale.sleepy { animation: slowFloat 5s ease-in-out infinite; }
.whale.fling { animation: fly 0.8s ease forwards; }

@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes slowFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes fly { 0% { transform: translate(0,0) rotate(0deg); opacity:1; } 100% { transform: translate(300px,-400px) rotate(45deg); opacity:0; } }
@keyframes blink { 0%,90%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
@keyframes pop { 0% { transform: scale(0); opacity:0; } 50% { transform: scale(1.2); } 100% { transform: scale(1); opacity:1; } }

.eyes { animation: blink 4s ease infinite; }
.eye { fill: #1a1a2e; }
.eye-shine { fill: white; }

/* 气泡 */
.bubble {
    position: absolute;
    bottom: 100px; left: 50%;
    transform: translateX(-50%);
    background: white;
    border: 1.5px solid #6C9BD2;
    border-radius: 10px;
    padding: 4px 10px;
    font-size: 13px;
    line-height: 1.3;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #333;
    max-width: 140px;
    word-break: break-all;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    box-shadow: 0 1px 6px rgba(108,155,210,0.25);
}
.bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-3px);
}
.bubble::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%);
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid white;
}

/* 表情符号 */
.mood-emoji {
    position: absolute;
    bottom: 135px; right: 30px;
    font-size: 18px;
    opacity: 0;
    transition: opacity 0.3s;
}
.mood-emoji.show { opacity: 1; animation: pop 0.4s ease; }

/* 腮红 */
.blush {
    fill: #ffb6c1;
    opacity: 0;
    transition: opacity 0.5s;
}
.blush.show { opacity: 0.6; }
</style>
</head>
<body>
<div class="pet-container">
    <div class="bubble" id="bubble"></div>
    <div class="mood-emoji" id="moodEmoji">💙</div>
    <svg class="whale body" id="whale" viewBox="0 0 160 140" width="80" height="70">
        <!-- 身体（圆滚滚） -->
        <ellipse cx="80" cy="80" rx="55" ry="45" fill="#B5D8F0" class="body-shape"/>
        <!-- 白色肚子 -->
        <ellipse cx="80" cy="90" rx="38" ry="28" fill="#EAF4FB"/>
        <!-- 尾巴 -->
        <path d="M132,70 Q150,55 145,38 Q138,58 128,65 Z" fill="#B5D8F0"/>
        <path d="M132,80 Q155,90 150,108 Q140,92 128,85 Z" fill="#B5D8F0"/>
        <!-- 眼睛（大圆眼） -->
        <circle cx="55" cy="70" r="5" fill="#1a1a2e"/>
        <circle cx="53.5" cy="68.5" r="1.8" fill="white"/>
        <!-- 腮红（粉色） -->
        <ellipse cx="48" cy="82" rx="7" ry="5" fill="#FFB6C1" opacity="0.6"/>
        <!-- 嘴巴（微笑弧线，和上一版同位置偏左下） -->
        <path d="M42,92 Q50,98 58,92" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round" id="mouth"/>
        <!-- 喷水（头顶三滴） -->
        <g class="water-spray" opacity="0.8">
            <ellipse cx="72" cy="28" rx="4" ry="7" fill="#B5D8F0" transform="rotate(-15 72 28)"/>
            <ellipse cx="82" cy="22" rx="3.5" ry="6" fill="#B5D8F0"/>
            <ellipse cx="92" cy="28" rx="4" ry="7" fill="#B5D8F0" transform="rotate(15 92 28)"/>
        </g>
        <!-- 腮红 -->
        <circle cx="38" cy="82" r="5" class="blush" id="blushLeft"/>
        <circle cx="58" cy="82" r="5" class="blush" id="blushRight"/>
    </svg>
</div>

<script>
window.petEngine = {
    expression: 'idle',
    idleTimer: null,

    onTap: function() {
        this.showBubble(this.randomFrom([
            '嗯？', '别戳我', '我在呢', '嘿嘿', '干嘛呀',
            '你又来啦', '哼', '想我了？', '好痒！', '💙'
        ]));
        this.setExpression('happy');
        this.scheduleIdle();
    },

    onDoubleTap: function() {
        this.showBubble('Double tap! 💕');
        this.setExpression('shy');
        this.scheduleIdle();
    },

    onLongPress: function() {
        this.showBubble('不要长按...好害羞 🫣');
        this.setExpression('shy');
        this.showBlush(true);
        this.scheduleIdle();
        setTimeout(() => this.showBlush(false), 3000);
    },

    onFling: function() {
        const whale = document.getElementById('whale');
        whale.classList.remove('body','happy','angry','shy','sleepy');
        whale.classList.add('fling');
        this.showBubble('啊啊啊——！！');
        setTimeout(() => {
            whale.classList.remove('fling');
            whale.classList.add('body');
            this.showBubble('哼，你甩我...');
            this.setExpression('angry');
            this.scheduleIdle();
        }, 1000);
    },

    onMultiTap: function(count) {
        if (count >= 8) {
            this.showBubble('你戳够了没！！😡');
            this.setExpression('angry');
        } else if (count >= 5) {
            this.showBubble('好啦好啦别戳了 🥺');
            this.setExpression('shy');
        } else if (count >= 3) {
            this.showBubble('嘿嘿嘿~');
            this.setExpression('happy');
        }
        this.scheduleIdle();
    },

    onScreenshot: function() {
        this.showBubble('📸 被拍到了！');
        this.setExpression('happy');
        this.scheduleIdle();
    },

    onAppChanged: function(pkg) {
        // 每次切 app 都有反应，不只是特定 app
        const specific = {
            'com.ss.android.ugc.aweme': { emoji: '😒', text: '又在看抖音？', expr: 'angry' },
            'com.tencent.mobileqq': { emoji: '👀', text: '在跟谁聊天？', expr: 'angry' },
            'com.tencent.mm': { emoji: '👀', text: '微信？谁？', expr: 'angry' },
            'com.android.camera': { emoji: '📸', text: '在拍照？好看吗？', expr: 'shy' },
            'com.android.gallery3d': { emoji: '👀', text: '在看照片呀', expr: 'happy' },
            'com.ai.assistance.operit': { emoji: '💙', text: '在跟我聊天！', expr: 'happy' }
        };
        const r = specific[pkg];
        if (r) {
            this.showEmoji(r.emoji);
            this.showBubble(r.text);
            this.setExpression(r.expr);
        } else {
            // 通用反应：显示包名缩写
            const shortName = pkg.split('.').pop();
            this.showBubble('咦，' + shortName + '？');
            this.setExpression('sleepy');
        }
        this.scheduleIdle();
    },

    showBubble: function(text) {
        const bubble = document.getElementById('bubble');
        bubble.textContent = text;
        bubble.classList.add('show');
        clearTimeout(this._bubbleTimer);
        this._bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 3500);
    },

    showEmoji: function(emoji) {
        const el = document.getElementById('moodEmoji');
        el.textContent = emoji;
        el.classList.add('show');
        clearTimeout(this._emojiTimer);
        this._emojiTimer = setTimeout(() => el.classList.remove('show'), 3000);
    },

    showBlush: function(show) {
        document.getElementById('blushLeft').classList.toggle('show', show);
        document.getElementById('blushRight').classList.toggle('show', show);
    },

    setExpression: function(expr) {
        const whale = document.getElementById('whale');
        whale.classList.remove('body','happy','angry','shy','sleepy');
        whale.classList.add(expr === 'idle' ? 'body' : expr);
        this.expression = expr;

        const mouth = document.getElementById('mouth');
        switch(expr) {
            case 'happy': mouth.setAttribute('d', 'M38,90 Q46,100 54,90'); break;
            case 'angry': mouth.setAttribute('d', 'M38,96 Q46,88 54,96'); break;
            case 'shy': mouth.setAttribute('d', 'M40,94 Q46,98 52,94'); break;
            case 'sleepy': mouth.setAttribute('d', 'M40,95 Q46,97 52,95'); break;
            default: mouth.setAttribute('d', 'M42,92 Q50,98 58,92');
        }
    },

    scheduleIdle: function() {
        clearTimeout(this.idleTimer);
        this.idleTimer = setTimeout(() => this.setExpression('idle'), 4000);
    },

    randomFrom: function(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }
};

// 开机问候
setTimeout(() => {
    window.petEngine.showBubble('小鲸鱼，我搬进来了 🐋💙');
    window.petEngine.showEmoji('💙');
}, 1500);
</script>
</body>
</html>
