name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Debug - list all outputs
        run: find . -name "*.apk" -type f || true
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-overlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest Debug Build
          body: Auto-built from main branch
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}