name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --info 2>&1 | tail -50
      - name: Find APK
        run: |
          echo "=== Finding APK ==="
          find app/build -name '*.apk' 2>/dev/null || echo 'No APK found'
          ls -la app/build/outputs/apk/ 2>/dev/null || echo 'No apk dir'
          ls -la app/build/outputs/ 2>/dev/null || echo 'No outputs dir'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest Build
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
