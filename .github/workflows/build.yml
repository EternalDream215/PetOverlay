name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Debug gradlew
        run: |
          echo "=== gradlew file content (first 5 lines) ==="
          head -5 gradlew
          echo "=== Test gradlew help ==="
          chmod +x gradlew
          ./gradlew help 2>&1 | tail -5
          echo "=== Test gradlew tasks ==="
          ./gradlew tasks 2>&1 | grep -i "assemble" || echo "no assemble found"
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50
      - name: Find APK
        run: |
          echo "=== APK search ==="
          find . -name "*.apk" -type f -exec ls -la {} \;
          echo "=== build/outputs ==="
          find . -path "*/build/outputs/*" -type f 2>/dev/null || echo "no outputs"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-overlay-debug
          path: "**/*.apk"
          if-no-files-found: warn
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest Debug Build
          body: Auto-built from main branch
          files: "**/*.apk"
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}