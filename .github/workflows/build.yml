name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon --stacktrace
      - name: Find APK
        run: |
          find . -name "*.apk" -type f -exec ls -la {} \; || true
          find . -path "*/outputs/*" -type f || true
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-overlay-debug
          path: "**/*.apk"
          if-no-files-found: warn
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest Debug Build
          body: Auto-built from main branch
          files: "**/*.apk"
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}