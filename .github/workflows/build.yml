name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: java -jar gradle/wrapper/gradle-wrapper.jar assembleDebug --no-daemon --stacktrace 2>&1
      - name: Find APK
        run: |
          echo "=== All files in build/outputs ==="
          find . -path "*/build/outputs/*" -type f -exec ls -la {} \; 2>/dev/null || echo "none"
          echo "=== All APK files ==="
          find . -name "*.apk" -type f -exec ls -la {} \; 2>/dev/null || echo "none"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-overlay-debug
          path: "**/*.apk"
          if-no-files-found: warn
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest Debug Build
          body: Auto-built from main branch
          files: "**/*.apk"
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}